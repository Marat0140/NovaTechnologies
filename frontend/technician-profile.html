<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Technologies | Perfil del Técnico</title>
    
    <!-- Estilos globales y de componentes -->
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/components.css">
</head>
<body style="background-color: #0b0f19; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Navbar -->
    <header class="navbar" style="background: #111827; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <div class="navbar-container" style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto; padding: 15px 20px;">
            <a href="client-dashboard.html" class="navbar-brand" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: white; font-weight: bold; font-size: 18px;">
                <span class="brand-icon">⚡</span>
                <span class="brand-name">Nova Technologies</span>
            </a>
            <nav class="navbar-links" style="display: flex; gap: 20px; align-items: center;">
                <a href="client-dashboard.html" class="nav-link" style="color: #3b82f6; text-decoration: none;">← Volver al Panel</a>
            </nav>
        </div>
    </header>

    <!-- Contenido Principal del Perfil -->
    <main style="flex: 1; max-width: 900px; width: 100%; margin: 40px auto; padding: 0 20px;">
        <div id="profileContainer" style="background: #111827; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 40px; box-shadow: 0 15px 35px rgba(0,0,0,0.5);">
            <p style="text-align: center; color: #9ca3af;">Cargando perfil del técnico...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer style="text-align: center; padding: 20px; color: #6b7280; font-size: 13px; border-top: 1px solid rgba(255,255,255,0.05);">
        &copy; 2026 Nova Technologies. Todos los derechos reservados.
    </footer>

    <!-- Script del Perfil -->
    <script src="./js/technician-profile.js"></script>
</body>
</html>
