<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Technologies | Solicitud de Cotización</title>
    
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/components.css">
</head>
<body style="background-color: #0b0f19; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Navbar -->
    <header class="navbar" style="background: #111827; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <div class="navbar-container" style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto; padding: 15px 20px;">
            <a href="client-dashboard.html" class="navbar-brand" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: white; font-weight: bold; font-size: 18px;">
                <span class="brand-icon">⚡</span>
                <span class="brand-name">Nova Technologies</span>
            </a>
            <nav class="navbar-links">
                <a href="client-dashboard.html" class="nav-link" style="color: #3b82f6; text-decoration: none;">← Volver al Panel</a>
            </nav>
        </div>
    </header>

    <!-- Formulario de Solicitud -->
    <main style="flex: 1; max-width: 700px; width: 100%; margin: 40px auto; padding: 0 20px;">
        <div style="background: #111827; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 35px; box-shadow: 0 15px 35px rgba(0,0,0,0.5);">
            <h1 style="font-size: 22px; margin-bottom: 8px; color: #fff;">⚡ Solicitar Cotización de Reparación</h1>
            <p style="color: #9ca3af; font-size: 14px; margin-bottom: 25px;">Llena los datos del equipo para que el técnico revise la falla y te responda por el chat.</p>

            <form id="requestForm">
                <!-- Categoría -->
                <div style="margin-bottom: 18px; text-align: left;">
                    <label style="display: block; font-size: 13px; color: #9ca3af; margin-bottom: 6px;">Categoría del Dispositivo</label>
                    <select id="deviceCategory" style="width: 100%; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 14px;" required>
                        <option value="">Selecciona una opción...</option>
                        <option value="Celulares y Tablets">📱 Celulares y Tablets</option>
                        <option value="Consolas y Controles">🎮 Consolas y Controles</option>
                        <option value="Computadoras y Laptops">💻 Computadoras y Laptops</option>
                    </select>
                </div>

                <!-- Modelo -->
                <div style="margin-bottom: 18px; text-align: left;">
                    <label style="display: block; font-size: 13px; color: #9ca3af; margin-bottom: 6px;">Marca y Modelo del Equipo</label>
                    <input type="text" id="deviceModel" placeholder="Ej: PlayStation 5 / iPhone 13 Pro / Asus ROG" style="width: 100%; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 14px;" required>
                </div>

                <!-- Descripción de la Falla -->
                <div style="margin-bottom: 18px; text-align: left;">
                    <label style="display: block; font-size: 13px; color: #9ca3af; margin-bottom: 6px;">Descripción de la Falla</label>
                    <textarea id="issueDescription" rows="4" placeholder="Describe lo que le sucede al equipo (ej: no enciende, pantalla rota, fallo de lectura)..." style="width: 100%; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 14px; resize: vertical;" required></textarea>
                </div>

                <!-- Botón Enviar -->
                <button type="submit" style="width: 100%; background: #3b82f6; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); margin-top: 10px;">
                    Enviar Solicitud al Técnico
                </button>
            </form>
        </div>
    </main>

    <!-- Script de Cotización -->
    <script src="./js/create-request.js"></script>
</body>
</html>
