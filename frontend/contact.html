<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Technologies | Contacto y Soporte</title>
    
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/components.css">
</head>
<body style="background-color: #0b0f19; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Navbar -->
    <header class="navbar" style="background: #111827; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <div class="navbar-container" style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto; padding: 15px 20px;">
            <a href="index.html" class="navbar-brand" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: white; font-weight: bold; font-size: 18px;">
                <span class="brand-icon">⚡</span>
                <span class="brand-name">Nova Technologies</span>
            </a>
            <nav class="navbar-links" style="display: flex; gap: 20px; align-items: center;">
                <a href="index.html" class="nav-link" style="color: #9ca3af; text-decoration: none;">Inicio</a>
                <a href="contact.html" class="nav-link" style="color: #3b82f6; text-decoration: none; font-weight: 500;">Soporte / Contacto</a>
            </nav>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main style="flex: 1; max-width: 700px; width: 100%; margin: 40px auto; padding: 0 20px;">
        <div style="background: #111827; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 35px; box-shadow: 0 15px 35px rgba(0,0,0,0.5);">
            <h1 style="font-size: 24px; margin-bottom: 8px; color: #fff;">📞 Centro de Soporte y Contacto</h1>
            <p style="color: #9ca3af; font-size: 14px; margin-bottom: 25px;">¿Tienes dudas con una reparación, problemas con tu cuenta o requieres asistencia técnica general? Envíanos un mensaje.</p>

            <form id="contactForm">
                <div style="margin-bottom: 18px; text-align: left;">
                    <label style="display: block; font-size: 13px; color: #9ca3af; margin-bottom: 6px;">Nombre Completo</label>
                    <input type="text" id="contactName" placeholder="Tu nombre" style="width: 100%; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 14px;" required>
                </div>

                <div style="margin-bottom: 18px; text-align: left;">
                    <label style="display: block; font-size: 13px; color: #9ca3af; margin-bottom: 6px;">Correo Electrónico</label>
                    <input type="email" id="contactEmail" placeholder="correo@ejemplo.com" style="width: 100%; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 14px;" required>
                </div>

                <div style="margin-bottom: 18px; text-align: left;">
                    <label style="display: block; font-size: 13px; color: #9ca3af; margin-bottom: 6px;">Asunto o Motivo</label>
                    <select id="contactSubject" style="width: 100%; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 14px;" required>
                        <option value="">Selecciona un motivo...</option>
                        <option value="Soporte con Orden">🛠️ Soporte con una Orden Activa</option>
                        <option value="Problema con Cuenta">🔐 Problemas de Acceso / Cuenta</option>
                        <option value="Alianzas y Talleres">💼 Unirme como Técnico / Taller</option>
                        <option value="Otro">💬 Otra consulta</option>
                    </select>
                </div>

                <div style="margin-bottom: 22px; text-align: left;">
                    <label style="display: block; font-size: 13px; color: #9ca3af; margin-bottom: 6px;">Mensaje</label>
                    <textarea id="contactMessage" rows="4" placeholder="Escribe los detalles de tu consulta..." style="width: 100%; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 14px; resize: vertical;" required></textarea>
                </div>

                <button type="submit" style="width: 100%; background: #3b82f6; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);">
                    Enviar Mensaje de Soporte
                </button>
            </form>
        </div>
    </main>

    <!-- Script de Envío -->
    <script>
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('contactName').value;
    const email = document.getElementById('contactEmail').value;
    const subject = document.getElementById('contactSubject').value;
    const message = document.getElementById('contactMessage').value;

    try {
        const res = await fetch('http://localhost:5000/api/admin/contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, subject, message })
        });

        if (res.ok) {
            alert('¡Mensaje enviado con éxito! Nuestro equipo de soporte lo revisará a la brevedad.');
            document.getElementById('contactForm').reset();
        } else {
            alert('Error al enviar el mensaje.');
        }
    } catch (error) {
        console.error('Error de conexión:', error);
        alert('No se pudo conectar con el servidor.');
    }
});
    </script>
</body>
</html>
