<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Technologies | Chat de Reparación</title>
    
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/components.css">
</head>
<body style="background-color: #0b0f19; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Navbar -->
    <header class="navbar" style="background: #111827; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <div class="navbar-container" style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1000px; margin: 0 auto; padding: 15px 20px;">
            <a href="#" id="backBtn" style="color: #3b82f6; text-decoration: none; font-weight: 500;">← Volver al Panel</a>
            <span id="chatOrderTitle" style="font-weight: bold; font-size: 16px;">Cargando Orden...</span>
            <span id="chatStatusBadge" style="font-size: 12px; padding: 4px 10px; border-radius: 12px; background: #1f2937;">-</span>
        </div>
    </header>

    <!-- Contenedor Principal del Chat -->
    <main style="flex: 1; max-width: 1000px; width: 100%; margin: 20px auto; padding: 0 20px; display: flex; flex-direction: column;">
        
        <!-- Tarjeta Informativa de la Orden -->
        <div id="orderInfoCard" style="background: #111827; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 15px 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <div>
                <h2 id="deviceModelText" style="font-size: 16px; margin: 0 0 4px 0; color: #fff;">-</h2>
                <p id="issueText" style="font-size: 13px; color: #9ca3af; margin: 0;">-</p>
            </div>
            <div id="priceQuoteContainer" style="text-align: right;">
                <span style="font-size: 12px; color: #9ca3af;">Presupuesto:</span>
                <p id="priceText" style="font-size: 18px; font-weight: bold; color: #10b981; margin: 0;">Pendiente</p>
            </div>
        </div>

        <!-- Panel Interactivo Dinámico (Aceptar/Rechazar, Re-cotizar, Códigos OTP) -->
        <div id="interactiveActionPanel" style="display: none; background: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 15px; margin-bottom: 15px;">
            <!-- Se inyectará según el estado y el rol (Cliente vs Técnico) -->
        </div>

        <!-- Caja de Mensajes -->
        <div id="messagesBox" style="flex: 1; min-height: 350px; max-height: 480px; background: #111827; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px;">
            <p style="text-align: center; color: #9ca3af;">Cargando historial de mensajes...</p>
        </div>

        <!-- Formulario de Envío de Mensaje -->
        <form id="chatForm" style="display: flex; gap: 10px;">
            <input type="text" id="messageInput" placeholder="Escribe un mensaje..." style="flex: 1; background: #1f2937; border: 1px solid #374151; padding: 14px; border-radius: 10px; color: #fff; font-size: 14px;" required>
            <button type="submit" style="background: #3b82f6; color: white; border: none; padding: 0 25px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.2s;">
                Enviar
            </button>
        </form>

    </main>

    <script src="./js/repair-chat.js"></script>
</body>
</html>
