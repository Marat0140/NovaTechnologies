<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Technologies | Panel de Administración</title>
    
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/components.css">
</head>
<body style="background-color: #0b0f19; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Navbar del Administrador -->
    <header class="navbar" style="background: #111827; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <div class="navbar-container" style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto; padding: 15px 20px;">
            <a href="admin-dashboard.html" class="navbar-brand" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: white; font-weight: bold; font-size: 18px;">
                <span class="brand-icon">⚡</span>
                <span class="brand-name">Nova Technologies <span style="font-size: 12px; background: #ef4444; color: #fff; padding: 2px 8px; border-radius: 10px; margin-left: 5px;">Administrador</span></span>
            </a>
            
            <nav class="navbar-links" style="display: flex; gap: 20px; align-items: center;">
                <a href="#" id="logoutBtn" style="color: #ef4444; text-decoration: none; font-weight: 500;">Cerrar Sesión</a>
            </nav>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main style="flex: 1; max-width: 1200px; width: 100%; margin: 30px auto; padding: 0 20px;">
        
        <!-- Tarjetas de Estadísticas Globales -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px;">
            <div style="background: #111827; border: 1px solid rgba(255,255,255,0.08); padding: 20px; border-radius: 12px; text-align: center;">
                <span style="font-size: 12px; color: #9ca3af; display: block;">Total Usuarios</span>
                <span id="statUsers" style="font-size: 26px; font-weight: bold; color: #3b82f6;">0</span>
            </div>
            <div style="background: #111827; border: 1px solid rgba(255,255,255,0.08); padding: 20px; border-radius: 12px; text-align: center;">
                <span style="font-size: 12px; color: #9ca3af; display: block;">Técnicos Registrados</span>
                <span id="statTechs" style="font-size: 26px; font-weight: bold; color: #10b981;">0</span>
            </div>
            <div style="background: #111827; border: 1px solid rgba(255,255,255,0.08); padding: 20px; border-radius: 12px; text-align: center;">
                <span style="font-size: 12px; color: #9ca3af; display: block;">Órdenes de Reparación</span>
                <span id="statOrders" style="font-size: 26px; font-weight: bold; color: #f59e0b;">0</span>
            </div>
            <div style="background: #111827; border: 1px solid rgba(255,255,255,0.08); padding: 20px; border-radius: 12px; text-align: center;">
                <span style="font-size: 12px; color: #9ca3af; display: block;">Tickets Pendientes</span>
                <span id="statTickets" style="font-size: 26px; font-weight: bold; color: #ef4444;">0</span>
            </div>
        </div>

        <!-- Pestañas de Gestión -->
        <div style="display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 15px;">
            <button class="admin-tab active" data-tab="users" style="padding: 10px 20px; border-radius: 8px; border: 1px solid #3b82f6; background: #3b82f6; color: white; cursor: pointer; font-weight: 500;">Gestión de Usuarios</button>
            <button class="admin-tab" data-tab="tickets" style="padding: 10px 20px; border-radius: 8px; border: 1px solid #374151; background: #1f2937; color: #9ca3af; cursor: pointer; font-weight: 500;">Solicitudes de Soporte</button>
        </div>

        <!-- Vista de Usuarios -->
        <div id="usersSection" style="background: #111827; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 25px;">
            <h2 style="font-size: 18px; margin-bottom: 15px; color: #fff;">Usuarios Registrados en Atlas</h2>
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; font-size: 14px; text-align: left;">
                    <thead>
                        <tr style="border-bottom: 1px solid rgba(255,255,255,0.1); color: #9ca3af;">
                            <th style="padding: 12px;">ID Único</th>
                            <th style="padding: 12px;">Nombre</th>
                            <th style="padding: 12px;">Correo</th>
                            <th style="padding: 12px;">Rol</th>
                            <th style="padding: 12px;">Edad</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="5" style="padding: 20px; text-align: center; color: #9ca3af;">Cargando usuarios...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Vista de Tickets de Soporte -->
        <div id="ticketsSection" style="display: none; background: #111827; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 25px;">
            <h2 style="font-size: 18px; margin-bottom: 15px; color: #fff;">Bandeja de Mensajes de Soporte</h2>
            <div id="ticketsContainer" style="display: flex; flex-direction: column; gap: 15px;">
                <p style="color: #9ca3af;">Cargando mensajes...</p>
            </div>
        </div>

    </main>

    <script src="./js/admin-dashboard.js"></script>
</body>
</html>
